name: Build M APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Get project
    uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: M-APK
      path: app/build/outputs/apk/debug/*.apk
