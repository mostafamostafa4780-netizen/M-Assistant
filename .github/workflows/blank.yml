
name: Build M APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: List project files
        run: |
          pwd
          ls -la
          find . -maxdepth 5 -type f -name gradlew
          find . -maxdepth 4 -type f -name build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
