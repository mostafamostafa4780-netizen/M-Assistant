
name: Build M APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          echo "Project files:"
          ls -la
          find . -maxdepth 5 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
